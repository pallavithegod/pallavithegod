name: Update Contribution Rocket

on:
  schedule:
    # Runs automatically once every day at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild live contribution rocket SVG
        run: |
          python scripts/gen-contrib-svg.py pallavithegod assets/contrib-rocket.svg

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-rocket.svg assets/sys-diagnostic.svg
          if git diff --staged --quiet; then
            echo "No contribution changes detected today."
          else
            git commit -m "chore(telemetry): auto-update contribution & streak telemetry [skip ci]"
            git push
          fi
